<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高中物理知识图谱（人教版 2019）</title>
<style>
:root{--bg:#0e1420;--panel:#151d2c;--line:#293349;--tx:#e8eefc;--tx2:#93a2c0;
--root:#ffd166;--book:#6ea8fe;--chap:#4fd1a5;--sec:#c79bf2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden;
font:14px/1.55 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
#app{display:flex;height:100%}
#side{width:326px;flex:0 0 326px;background:var(--panel);border-right:1px solid var(--line);
padding:14px;overflow:auto}
#side h1{font-size:17px;margin:0 0 3px}
.sub{color:var(--tx2);font-size:12px;margin-bottom:12px}
.card{background:#101826;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:11px}
.card>b{display:block;font-size:11.5px;color:var(--tx2);font-weight:600;margin:0 0 8px;letter-spacing:.6px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:5px 0}
input[type=search]{width:100%;background:#0b1220;color:var(--tx);border:1px solid var(--line);
border-radius:7px;padding:7px 9px;font-size:13px}
button{background:#20304f;color:var(--tx);border:1px solid var(--line);border-radius:7px;
padding:5px 10px;font-size:12px;cursor:pointer}
button:hover{background:#2b4069}
.lab{display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;user-select:none;width:100%}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto}
.num{color:var(--tx2);font-size:11.5px}
#stage{flex:1;position:relative;overflow:hidden;cursor:grab}
#stage.drag{cursor:grabbing}
svg{width:100%;height:100%;display:block}
.nd{cursor:pointer}
.nd text{fill:var(--tx);dominant-baseline:middle}
.nd:hover rect{stroke:#fff!important}
.link{fill:none;stroke:#303c56;stroke-width:1.25}
.rel{fill:none;stroke-width:1.7;opacity:.95;stroke-dasharray:6 4;pointer-events:none}
.rel.all{opacity:.24;stroke-width:.9;stroke-dasharray:none}
#tip{position:absolute;pointer-events:none;background:#0a101c;border:1px solid var(--line);
border-radius:8px;padding:8px 11px;font-size:12px;max-width:350px;display:none;z-index:9;
box-shadow:0 10px 26px rgba(0,0,0,.55);line-height:1.5}
#tip .t{font-size:13px;font-weight:600;margin-bottom:4px}
#tip .p{color:var(--tx2)}
#relp{max-height:196px;overflow:auto;font-size:12px;line-height:1.5}
#relp>div{padding:5px 0;border-bottom:1px dashed #222c40;color:var(--tx2)}
#relp>div:first-child{border-top:1px dashed #222c40;margin-top:4px}
#relp span{color:var(--tx)}
#bar{position:absolute;right:12px;top:12px;display:flex;gap:6px}
#stat{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--tx2);
background:rgba(14,20,32,.88);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
#toc{font-size:12px;max-height:250px;overflow:auto}
#toc i{display:block;font-style:normal;padding:3px 0;cursor:pointer;color:var(--tx2)}
#toc i:hover{color:var(--tx)}
#toc i.bk{color:#6ea8fe;font-weight:600;margin-top:6px}
#toc i.ch{padding-left:11px}
/* 浅色主题：投影与打印时对比度更好 */
body.light{--bg:#f3f6fb;--panel:#ffffff;--line:#d2dae8;--tx:#1b2436;--tx2:#5a6a85;
--root:#a06b00;--book:#2a63c2;--chap:#0f6b50;--sec:#6c3ec0}
body.light .link{stroke:#a9b7cf}
body.light .rel{stroke-width:2.3}
body.light .rel.all{opacity:.62}
body.light .nd text{fill:#1b2436}
body.light button{background:#e8eef8;color:#1b2436;border-color:#c9d4e8}
body.light button:hover{background:#dbe6f6}
body.light #stat{background:rgba(255,255,255,.92)}
body.light #tip{background:#ffffff}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>高中物理知识图谱</h1>
    <div class="sub">人教版（2019）· 必修 3 册 + 选择性必修 3 册<br>四级思维导图 + 跨章节关系网络</div>

    <div class="card">
      <b>搜索知识点（回车定位）</b>
      <div class="row"><input id="q" type="search" placeholder="例如：动量守恒 / E=BLv / 油膜法 / 临界角"></div>
      <div class="row"><span class="num" id="qr"></span></div>
    </div>

    <div class="card">
      <b>第四层知识点 · 四类标签着色</b>
      <div class="row" id="tf"></div>
    </div>

    <div class="card">
      <b>跨章节关系连线 · 三类</b>
      <div class="row" id="rf"></div>
      <div class="row"><label class="lab"><input type="checkbox" id="ar"> 淡显全部前置依赖主线（易混/数学线仍只在选中时高亮）</label></div>
    </div>

    <div class="card">
      <b>视图</b>
      <div class="row">
        <button id="fit">适应屏幕</button>
        <button id="e1">全部展开</button>
        <button id="e2">展开到节</button>
        <button id="e3">只到章</button>
        <button id="e4">只留六册</button>
      </div>
      <div class="row"><span class="num">拖拽空白平移 · 滚轮缩放 · 单击节点折叠/展开并查看关系 · 双击节点展开整条路径并居中</span></div>
    </div>

    <div class="card">
      <b>选中节点的跨章节关系</b>
      <div id="relp">尚未选中节点。</div>
    </div>

    <div class="card">
      <b>教材目录导航（点击直达）</b>
      <div id="toc"></div>
    </div>
  </aside>

  <main id="stage">
    <div id="bar"><button id="th">浅色主题</button><button id="z1">＋</button><button id="z2">－</button></div>
    <svg id="svg"><g id="view"><g id="gl"></g><g id="rl"></g><g id="nl"></g></g></svg>
    <div id="tip"></div>
    <div id="stat"></div>
  </main>
</div>

 light:{PC:{c:'#1f5fbf',l:'#0f7a56',m:'#a9660a',e:'#c2405c'},
       RC:{dep:'#0f7a56',vs:'#c2405c',math:'#1f5fbf'},
       BC:{root:'#a06b00',book:'#2a63c2',chapter:'#0f6b50',section:'#6c3ec0',point:'#1f5fbf'},

function isVis(n){
  if(n.ty==='point'&&!showPT[n.pt])return false;
  let c=n;
  while(c.pid){if(collapsed[c.id]&&c.id!==n.id)return false;c=N[c.pid];}
  return true;
}
function textW(t,fs){let u=0;for(const c of t)u+=c.codePointAt(0)<720?fs*.56:fs;return u;}
function nodeW(n){
  if(n.ty==='point')return Math.min(336,Math.max(76,textW(n.title,12.5)+34));
  if(n.ty==='section')return Math.min(250,Math.max(122,textW(n.title,13)+44));
  return Math.min(236,Math.max(128,textW(n.title,14)+48));
}
function countDesc(id){let s=0;(CHILD[id]||[]).forEach(k=>{s+=1+countDesc(k);});return s;}
function layout(){
  const p={};let y=0;
  (function walk(id,d){
    const n=N[id];
    if(!isVis(n))return;
    const kids=(CHILD[id]||[]).filter(k=>isVis(N[k]));
    const w=nodeW(n),h=n.ty==='point'?23:(n.ty==='section'?27:35);
    if(!kids.length){p[id]={y:y,w:w,h:h,d:d};y+=h+5;}
    else{kids.forEach(k=>walk(k,d+1));
      p[id]={y:(p[kids[0]].y+p[kids[kids.length-1]].y)/2,w:w,h:h,d:d};}
  })('n0',0);
  const cw=[0,0,0,0,0];
  Object.keys(p).forEach(id=>{const o=p[id];o.d=Math.min(o.d,4);cw[o.d]=Math.max(cw[o.d],o.w);});
  let x=34;const colX=[];
  for(let d=0;d<5;d++){colX[d]=x;x+=cw[d]+(d===0?28:d<3?30:26);}
  Object.keys(p).forEach(id=>{p[id].x=colX[p[id].d];});
  pos=p;
  let mx=0,my=0;
  Object.keys(p).forEach(id=>{const o=p[id];mx=Math.max(mx,o.x+o.w+34);my=Math.max(my,o.y+34);});
  bounds={w:mx,h:Math.max(my,260)};
}
function gNode(n,o){

  r.setAttribute('fill',BF[n.ty]);
  r.setAttribute('stroke',n.ty==='point'?(PC[n.pt]||BC.point):BC[n.ty]);
  r.setAttribute('stroke-width',n.ty==='point'?1.3:1.7);

    c.setAttribute('fill',PC[n.pt]||'#888');g.appendChild(c);tx=21;

  if(n.ty!=='point')t.setAttribute('font-weight','600');
  const avail=o.w-tx-(hasKids?26:10),fs=n.ty==='point'?12.5:13.5;
  let s=n.title;
  if(textW(s,fs)>avail){while(s.length>2&&textW(s+'\u2026',fs)>avail)s=s.slice(0,-1);s+='\u2026';}
  t.textContent=s;g.appendChild(t);
  if(hasKids){
    const b=E('text');b.setAttribute('x',o.w-9);b.setAttribute('y',.5);
    b.setAttribute('text-anchor','end');b.setAttribute('font-size',11);
    b.setAttribute('fill',collapsed[n.id]?'#ffd166':'#93a2c0');
    b.textContent=collapsed[n.id]?('+'+countDesc(n.id)):'\u2212';
    g.appendChild(b);
  }
  if(n.hit)r.setAttribute('stroke','#ffd166'),r.setAttribute('stroke-width','2.6');
  if(n.id===selected){r.setAttribute('stroke','#ffffff');r.setAttribute('stroke-width','2.8');}
  return g;
}

    p.setAttribute('d','M'+(A.x+A.w)+' '+A.y+' C'+(A.x+A.w+bulge)+' '+A.y+', '+(B.x+B.w+bulge)+' '+B.y+', '+(B.x+B.w)+' '+B.y);
    p.setAttribute('class','rel'+(allRel&&!linkSel?' all':''));
    p.setAttribute('stroke',RC[e.t]);rl.appendChild(p);
  });
}
function render(){
  layout();
  nl.textContent='';
  const nf=document.createDocumentFragment();
  DATA.nodes.forEach(n=>{if(pos[n.id])nf.appendChild(gNode(n,pos[n.id]));});
  nl.appendChild(nf);
  drawTree();drawRel();
  document.getElementById('stat').innerHTML=
    '六册 '+DATA.stats.chapters+' 章 · '+DATA.stats.sections+' 节 · '+DATA.stats.points+' 个知识点 · 全图 '+
    DATA.stats.total+' 节点 · 跨节点关系 '+DATA.stats.edges+' 条（前置 '+DATA.stats.by_rel['前置依赖']+
    ' / 易混 '+DATA.stats.by_rel['易混对比']+' / 数学工具 '+DATA.stats.by_rel['数学工具支撑']+
    '）· 当前视图 '+Object.keys(pos).length+' 节点';
}
/* 平移缩放 */
let vx=20,vy=16,vs=.85;
function apply(){view.setAttribute('transform','translate('+vx+','+vy+') scale('+vs+')');}
function fit(){
  const r=stage.getBoundingClientRect();
  vs=Math.max(.1,Math.min(1.15,Math.min((r.width-56)/bounds.w,(r.height-56)/bounds.h)));
  vx=(r.width-bounds.w*vs)/2;vy=(r.height-bounds.h*vs)/2;apply();
}
stage.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const r=stage.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  const k=ev.deltaY<0?1.12:1/1.12,ns=Math.max(.1,Math.min(2.6,vs*k));
  vx=mx-(mx-vx)*(ns/vs);vy=my-(my-vy)*(ns/vs);vs=ns;apply();
},{passive:false});
let dg=null;
stage.addEventListener('mousedown',ev=>{
  if(ev.target.closest('.nd'))return;
  dg=[ev.clientX,ev.clientY,vx,vy];stage.classList.add('drag');});
window.addEventListener('mousemove',ev=>{if(dg){vx=dg[2]+ev.clientX-dg[0];vy=dg[3]+ev.clientY-dg[1];apply();}});
window.addEventListener('mouseup',()=>{dg=null;stage.classList.remove('drag');});
document.getElementById('z1').onclick=()=>{vs=Math.min(2.6,vs*1.25);apply();};
document.getElementById('z2').onclick=()=>{vs=Math.max(.1,vs/1.25);apply();};
document.getElementById('fit').onclick=fit;
document.getElementById('th').onclick=()=>{
  theme=theme==='dark'?'light':'dark';
  document.body.classList.toggle('light',theme==='light');
  usePal(theme);
  document.getElementById('th').textContent=theme==='dark'?'浅色主题':'深色主题';
  document.querySelectorAll('#tf .dot,#rf .dot').forEach(d=>{
    const k=d.getAttribute('data-k');
    if(k)d.style.background=(PC[k]||RC[k]);});
  if(selected)fillRelp(selected);
  render();};
/* 节点交互 */
const svgEl=document.getElementById('svg');
svgEl.addEventListener('click',ev=>{
  const g=ev.target.closest('.nd');if(!g)return;
  const id=g.dataset.id,n=N[id];
  if(n.ty!=='point'&&(CHILD[id]||[]).length)collapsed[id]=!collapsed[id];
  select(id);});
svgEl.addEventListener('dblclick',ev=>{
  const g=ev.target.closest('.nd');if(!g)return;
  openPath(g.dataset.id);collapsed[g.dataset.id]=false;render();centerOn(g.dataset.id);});
svgEl.addEventListener('mouseover',ev=>{
  const g=ev.target.closest('.nd');if(!g)return;
  hoverId=g.dataset.id;showTip(g.dataset.id,ev);drawRel();});
svgEl.addEventListener('mousemove',ev=>{if(hoverId)placeTip(ev);});
svgEl.addEventListener('mouseout',ev=>{
  const g=ev.target.closest('.nd');if(!g)return;
  hoverId=null;tipEl.style.display='none';drawRel();});
function showTip(id,ev){
  const n=N[id],chain=[];let c=n;
  while(c){chain.unshift(c.ty==='point'?c.sec:c.title);c=c.pid?N[c.pid]:null;}
  const lvl={root:'图谱根',book:'册（第一层）',chapter:'章（第二层）',section:'节（第三层）'}[n.ty];
  tipEl.innerHTML='<div class="t">'+esc(n.title)+'</div><div class="p">'+
    (n.ty==='point'?'类型：'+(PN[n.pt]||'—')+' ｜ 层级：知识点（第四层）':'类型：'+lvl)+'<br>'+
    chain.slice(0,-1).join(' › ')+
    (DEG[id]?'<br>跨章节关系 '+DEG[id]+' 条（单击或选中查看）':'')+'</div>';
  tipEl.style.display='block';placeTip(ev);
}
function placeTip(ev){
  const r=stage.getBoundingClientRect();
  tipEl.style.left=Math.min(Math.max(8,ev.clientX-r.left+15),Math.max(8,r.width-366))+'px';
  tipEl.style.top=Math.min(ev.clientY-r.top+16,Math.max(8,r.height-140))+'px';
}
function select(id){
  selected=id;
  fillRelp(id);
  render();
  if(id)centerOn(id);
}
function fillRelp(id){
  const rels=EDGE.filter(e=>e.a===id||e.b===id);
  relp.innerHTML=!id?'尚未选中节点。单击任意节点，这里会列出它与全图谱的跨章节关系。':
    (!rels.length?'「'+esc(N[id].title)+'」暂无跨章节关系连线，仅处于层级结构中。':
      '<div style="color:var(--tx);border:0">「'+esc(N[id].title)+'」共 '+rels.length+' 条跨章节关系</div>'+
      rels.map(e=>{
        const other=e.a===id?e.b:e.a,dir=e.a===id?'→':'←',pn=N[other];
        return '<div><span style="color:'+RC[e.t]+'">'+RN[e.t]+'</span> '+dir+' <span>'+
          esc(pn.title)+'</span><br>'+esc(e.note)+'<br><span style="color:var(--tx2)">'+
          esc(pn.book)+(pn.chap?' · '+esc(pn.chap):'')+'</span></div>';}).join(''));
}
function centerOn(id){
  const o=pos[id];if(!o)return;
  const r=stage.getBoundingClientRect();
  vx=r.width*.34-o.x*vs;vy=r.height/2-o.y*vs;apply();
}
function openPath(id){let c=N[id];while(c&&c.pid){collapsed[c.id]=false;c=N[c.pid];}}
/* 侧栏 */
const tf=document.getElementById('tf');
['c','l','m','e'].forEach(k=>{
  const l=document.createElement('label');l.className='lab';
  l.innerHTML='<input type="checkbox" checked> <i class="dot" data-k="'+k+'" style="background:'+PC[k]+
    '"></i> '+PN[k]+' <span class="num">'+DATA.stats.by_type[PN[k]]+'</span>';
  l.querySelector('input').onchange=e=>{showPT[k]=e.target.checked?1:0;render();};
  tf.appendChild(l);});
const rf=document.getElementById('rf');
['dep','vs','math'].forEach(k=>{
  const l=document.createElement('label');l.className='lab';
  l.innerHTML='<input type="checkbox" checked> <i class="dot" data-k="'+k+'" style="background:'+RC[k]+
    '"></i> '+RN[k]+' <span class="num">'+DATA.stats.by_rel[RN[k]]+'</span>';
  l.querySelector('input').onchange=e=>{showRel[k]=e.target.checked?1:0;drawRel();};
  rf.appendChild(l);});
document.getElementById('ar').onchange=e=>{allRel=e.target.checked?1:0;drawRel();};
function setLevel(fn){DATA.nodes.forEach(n=>{if(n.ty!=='point')collapsed[n.id]=fn(n.ty);});render();fit();}
document.getElementById('e1').onclick=()=>setLevel(t=>false);
document.getElementById('e2').onclick=()=>setLevel(t=>t==='section');
document.getElementById('e3').onclick=()=>setLevel(t=>t==='chapter'||t==='section');
document.getElementById('e4').onclick=()=>setLevel(t=>t!=='root');
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const s=q.value.trim().toLowerCase(),out=document.getElementById('qr');
  DATA.nodes.forEach(n=>n.hit=0);
  if(!s){out.textContent='';render();return;}
  const hits=DATA.nodes.filter(n=>n.title.toLowerCase().indexOf(s)>=0);
  hits.forEach(n=>{n.hit=1;openPath(n.id);});
  out.textContent='命中 '+hits.length+' 个节点（已展开所在分支，回车定位第一个）';
  render();});
q.addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  const s=q.value.trim().toLowerCase();
  const hit=DATA.nodes.filter(n=>n.title.toLowerCase().indexOf(s)>=0);
  if(hit.length)select(hit[0].id);});
const toc=document.getElementById('toc');
DATA.meta.forEach(b=>{
  const h=document.createElement('i');h.className='bk';
  h.textContent=b.book+'（'+b.grade+'，'+b.chapters.length+' 章）';
  toc.appendChild(h);
  b.chapters.forEach(c=>{
    const i=document.createElement('i');i.className='ch';
    const nPts=c.sections.reduce((a,s)=>a+s.n,0);
    i.textContent=c.title+'（'+c.sections.length+' 节 · '+nPts+' 知识点）';
    i.onclick=()=>{
      const t=DATA.nodes.find(x=>x.ty==='chapter'&&x.book===b.book&&x.chap===c.title);
      if(!t)return;
      openPath(t.id);collapsed[t.id]=false;render();select(t.id);};
    toc.appendChild(i);});});
render();fit();
window.addEventListener('resize',fit);
</script>
</body>
</html>
